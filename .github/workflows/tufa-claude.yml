# Tufa only; upstream (radixark/miles) has no such file. Same workflow as rave's claude.yml.
#
# A pull request comment that mentions @claude, from someone with write access, gets an answer
# from Claude: "@claude review" for a full review, or any question about the change.
# Read-only: Claude comments, it does not edit files or push. Same token and GitHub App as
# tufa-claude-review.yml. Comment workflows run from the default branch (tufa/main), so this
# works once it is merged there.
name: tufa-claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: tufa-claude-${{ github.event.issue.number || github.event.pull_request.number }}

jobs:
  claude:
    if: >-
      contains(github.event.comment.body, '@claude') &&
      (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number || github.event.pull_request.number }}/head
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*)"
            --disallowedTools "Edit,Write,NotebookEdit"
            --max-turns 60
